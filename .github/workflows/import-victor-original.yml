name: Import original Victor portrait

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-victor-original.yml"

permissions:
  contents: write

jobs:
  import-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download original portrait
        run: |
          mkdir -p assets
          curl -fL "https://d2ol7oe51mr4n9.cloudfront.net/user_3JVQ8LdVRmXdWymbfX17LphqiGi/dc585778-c822-41f3-8d39-e61348551e96.png" -o assets/victor-editorial.png
          file assets/victor-editorial.png
          ls -lh assets/victor-editorial.png

      - name: Commit original portrait and remove importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/victor-editorial.png
          git rm .github/workflows/import-victor-original.yml
          git commit -m "assets: add original Victor portrait"
          git push origin main
