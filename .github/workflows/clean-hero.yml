name: Clean hero star flares

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/clean-hero.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tools
        run: python -m pip install --quiet opencv-python-headless numpy pillow

      - name: Remove baked bright flare stars without dark patches
        run: |
          python - <<'PY'
          import cv2
          import numpy as np
          from pathlib import Path

          path = Path("assets/hero-cosmos-4k.webp")
          img = cv2.imread(str(path), cv2.IMREAD_COLOR)
          if img is None:
              raise SystemExit("hero image not found")

          h, w = img.shape[:2]

          # Coordinates from the original 1672x941 composition. We only treat
          # the oversized lens-flare stars baked into the artwork, not the
          # natural background star field.
          points = [
              (456, 70, 34),    # bright blue, upper-left
              (1237, 147, 48),  # bright cyan
              (1478, 234, 50),  # bright violet
              (925, 386, 33),   # bright cyan/white
              (1051, 477, 38),  # bright warm star
              (1491, 536, 46),  # bright blue lower-right
          ]

          sx = w / 1672.0
          sy = h / 941.0

          mask = np.zeros((h, w), dtype=np.uint8)

          # Build a selective mask around each flare. Within each region, only
          # the brightest pixels and their rays are selected. This keeps the
          # nebula texture and normal tiny stars intact.
          gray = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)
          hsv = cv2.cvtColor(img, cv2.COLOR_BGR2HSV)
          sat = hsv[:,:,1]

          for x0, y0, radius0 in points:
              cx, cy = int(x0*sx), int(y0*sy)
              radius = int(radius0 * (sx+sy)/2)
              yy, xx = np.ogrid[:h, :w]
              circle = ((xx-cx)**2 + (yy-cy)**2) <= radius**2

              # Bright cores and luminous rays only.
              local = circle & ((gray > 170) | ((gray > 145) & (sat > 45)))
              mask[local] = 255

          # Expand just enough to include ray edges, then softly inpaint from
          # neighboring sky. No dark overlays are introduced.
          mask = cv2.dilate(mask, np.ones((7,7), np.uint8), iterations=2)
          cleaned = cv2.inpaint(img, mask, 5, cv2.INPAINT_TELEA)

          # Blend a feathered transition so the repaired sky keeps the original
          # texture and there are no obvious circles or smudges.
          feather = cv2.GaussianBlur(mask, (0,0), sigmaX=10, sigmaY=10).astype(np.float32) / 255.0
          feather = feather[...,None]
          result = (cleaned.astype(np.float32)*feather + img.astype(np.float32)*(1-feather))
          result = np.clip(result,0,255).astype(np.uint8)

          # Preserve full 4K dimensions and high WebP quality.
          ok = cv2.imwrite(str(path), result, [cv2.IMWRITE_WEBP_QUALITY, 88])
          if not ok:
              raise SystemExit("failed to save cleaned hero")

          print("cleaned hero:", w, "x", h, "mask pixels:", int((mask>0).sum()))
          PY
          ls -lh assets/hero-cosmos-4k.webp

      - name: Commit cleaned hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-cosmos-4k.webp
          git commit -m "fix: clean baked hero star flares" || exit 0
          git push origin main
