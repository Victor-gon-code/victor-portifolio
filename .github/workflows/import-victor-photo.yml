name: Import editorial portrait

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-victor-photo.yml"

permissions:
  contents: write

jobs:
  import-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Download and optimize portrait
        run: |
          mkdir -p assets
          curl -fL "https://d2ol7oe51mr4n9.cloudfront.net/user_3JVQ8LdVRmXdWymbfX17LphqiGi/dc585778-c822-41f3-8d39-e61348551e96.png" -o /tmp/victor-editorial.png
          cwebp -quiet -q 94 /tmp/victor-editorial.png -o assets/victor-editorial.webp
          webpinfo assets/victor-editorial.webp | grep -E "Width|Height"

      - name: Commit portrait and remove importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/victor-editorial.webp
          git rm .github/workflows/import-victor-photo.yml
          git commit -m "assets: add Victor editorial portrait"
          git push origin main
