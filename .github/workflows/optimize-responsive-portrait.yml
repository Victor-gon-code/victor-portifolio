name: Optimize responsive portrait

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-responsive-portrait.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Build responsive portrait files
        run: |
          cwebp -quiet -mt -m 6 -q 94 -sharp_yuv -resize 480 0 assets/victor-editorial.png -o assets/victor-portrait-480.webp
          cwebp -quiet -mt -m 6 -q 94 -sharp_yuv -resize 800 0 assets/victor-editorial.png -o assets/victor-portrait-800.webp
          cwebp -quiet -mt -m 6 -q 95 -sharp_yuv assets/victor-editorial.png -o assets/victor-portrait-1187.webp
          ls -lh assets/victor-portrait-*.webp

      - name: Commit files and remove importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/victor-portrait-480.webp assets/victor-portrait-800.webp assets/victor-portrait-1187.webp
          git rm .github/workflows/optimize-responsive-portrait.yml
          git commit -m "perf: add responsive portrait assets"
          git push origin main
