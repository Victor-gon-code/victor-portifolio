name: Install final hero image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-final-hero.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download approved hero image
        run: |
          mkdir -p assets
          curl -fL "https://d2ol7oe51mr4n9.cloudfront.net/user_3JVQ8LdVRmXdWymbfX17LphqiGi/706b0d4f-2ff7-4423-961a-0611d8973b5c.png" -o assets/hero-final.png
          file assets/hero-final.png
          ls -lh assets/hero-final.png

      - name: Commit approved hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-final.png
          git commit -m "feat: install approved clean cosmic hero" || exit 0
          git push origin main
