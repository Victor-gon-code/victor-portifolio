name: Import portfolio showcase images

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-showcase-images.yml"

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WebP encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp

      - name: Download and optimize showcase images
        run: |
          set -euo pipefail
          curl -fL "https://d2ol7oe51mr4n9.cloudfront.net/user_3JVQ8LdVRmXdWymbfX17LphqiGi/3528bc49-3534-4620-b68f-ad0f35d92fae.png" -o /tmp/tanarede-home.png
          curl -fL "https://d2ol7oe51mr4n9.cloudfront.net/user_3JVQ8LdVRmXdWymbfX17LphqiGi/5410cfa8-2bc6-4e09-8eb3-e653da94264e.png" -o /tmp/tanarede-perfil.png
          cwebp -quiet -q 92 -m 6 /tmp/tanarede-home.png -o assets/tanarede-home.webp
          cwebp -quiet -q 92 -m 6 /tmp/tanarede-perfil.png -o assets/tanarede-perfil.webp

      - name: Verify generated images
        run: |
          webpinfo assets/tanarede-home.webp | grep -E "Width|Height"
          webpinfo assets/tanarede-perfil.webp | grep -E "Width|Height"

      - name: Clean temporary staging files
        run: |
          rm -rf assets/.chunks
          rm -f .github/workflows/import-showcase-images.yml

      - name: Commit imported images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "assets: add Tanarede showcase screenshots"
          git push
